<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Калькулятор экономии от внедрения систем точного земледелия."><title>Экономический расчет — AgroPrecision Dealer</title><link rel="stylesheet" href="/css/main.css"></head><body><div id="headerComponent"></div><main><section class="hero"><div class="container"><h1>Экономический расчёт</h1><p>Оцените потенциал экономии по вашим площадям и операциям.</p></div></section><section><div class="container grid-2"><form id="economyCalc" class="card form-wrap"><label>Площадь, га<input type="number" name="area" required min="1" placeholder="Например, 5000"></label><label>Культура<select name="culture"><option>Пшеница</option><option>Кукуруза</option><option>Подсолнечник</option><option>Соя</option></select></label><label>Ширина захвата, м<input type="number" name="width" required min="1" placeholder="Например, 24"></label><label>Тип работ<select name="work"><option value="spray">Опрыскивание</option><option value="fert">Внесение удобрений</option><option value="seeding">Посев</option></select></label><button class="btn btn-accent" type="submit">Рассчитать</button></form><div id="calcResult" class="form-wrap"><div class="card"><h3>Что покажет расчет</h3><p>— Экономия ГСМ</p><p>— Экономия СЗР</p><p>— Окупаемость решения</p><a class="btn btn-outline" href="/contact/index.html">Получить точный расчёт</a></div></div></div></section></main><div id="footerComponent"></div><script src="/js/main.js"></script></body></html>
