<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Финансовый калькулятор экономии и ROI."><title>Расчёт экономии — АгроКонтур</title><link rel="stylesheet" href="/css/main.css"></head>
<body data-page="home"><div data-include="header"></div><main>
<section class="story"><div class="container"><h1>Финансовый калькулятор экономии</h1><p class="lead">Инструмент для предварительной бизнес-оценки: экономия по статьям, ROI и срок окупаемости.</p>
<article class="card">
<!-- Вставьте ваш Formspree endpoint -->
<form id="payback-form" class="form" data-ajax-form="true" method="POST" action="https://formspree.io/f/XXXXXXXX">
<div class="form-grid">
<label>Площадь, га<input type="number" name="area" min="100" required></label>
<label>Регион<input name="region" required placeholder="Например: Воронежская область"></label>
<label>Культура<select name="crop" required><option value="">Выберите</option><option value="wheat">Пшеница</option><option value="barley">Ячмень</option><option value="corn">Кукуруза</option><option value="sunflower">Подсолнечник</option><option value="rapeseed">Рапс</option><option value="soy">Соя</option><option value="sugarbeet">Сахарная свёкла</option></select></label>
<label>Тип операции<select name="operation" required><option value="">Выберите</option><option value="sowing">Посев</option><option value="fertilizing">Внесение удобрений</option><option value="spraying">Опрыскивание</option></select></label>
<label>Тип удобрений<select name="fertType"><option value="">—</option><option value="nitrogen">Азотные</option><option value="phosphorus">Фосфорные</option><option value="potassium">Калийные</option><option value="complex">Комплексные</option></select></label>
<label>Ширина захвата, м<input type="number" name="capture" min="3" max="48" step="0.5" required></label>
<label>Норма внесения, кг/л на га<input type="number" name="rate" min="1" step="0.1" required></label>
</div>
<input type="hidden" name="calc_total"><input type="hidden" name="calc_roi"><input type="hidden" name="calc_payback">
<button class="btn-primary" type="submit">Рассчитать ROI</button>
<p class="form-status"></p>
</form>

<div class="calc-result">
<h2>Результат</h2>
<div class="result-grid">
<div class="result-item"><p>Экономия удобрений</p><strong id="out-fert">0 ₽</strong></div>
<div class="result-item"><p>Экономия СЗР</p><strong id="out-chem">0 ₽</strong></div>
<div class="result-item"><p>Экономия ГСМ</p><strong id="out-fuel">0 ₽</strong></div>
<div class="result-item"><p>Общая экономия</p><strong id="out-total">0 ₽</strong></div>
<div class="result-item"><p>ROI</p><strong id="out-roi">0 %</strong></div>
<div class="result-item"><p>Окупаемость</p><strong id="out-payback">0 мес.</strong></div>
</div>
</div>
<p><a class="btn-secondary" href="/contact/">Получить детализированный расчёт</a></p>
</article></div></section>
</main><div data-include="footer"></div><script src="/js/main.js" defer></script></body></html>
