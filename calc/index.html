<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Калькулятор окупаемости систем точного земледелия.">
  <title>Экономический расчёт — АгроКонтур</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body data-page="calc">
<div data-include="header"></div>
<main>
  <div class="container">
    <section class="hero story">
      <h1>Экономический расчёт проекта за 2 минуты</h1>
      <p class="lead">Введите параметры хозяйства, чтобы оценить потенциальную экономию и ориентировочный срок окупаемости внедрения.</p>
    </section>

    <section class="story card">
      <!-- Форма расчёта с JS-логикой в /js/calc.js -->
      <form id="payback-form" class="form">
        <label>Площадь, га
          <input type="number" name="area" min="100" step="10" placeholder="Например, 4500" required>
        </label>
        <label>Культура
          <select name="crop" required>
            <option value="">Выберите культуру</option>
            <option value="wheat">Пшеница</option>
            <option value="corn">Кукуруза</option>
            <option value="sunflower">Подсолнечник</option>
            <option value="rapeseed">Рапс</option>
          </select>
        </label>
        <label>Ширина захвата, м
          <input type="number" name="capture" min="3" max="24" step="0.5" placeholder="Например, 12" required>
        </label>
        <button type="submit">Рассчитать</button>
      </form>

      <div class="output">
        <p><strong>Оценочная экономия:</strong> <span id="economy-output">—</span></p>
        <p><strong>Срок окупаемости:</strong> <span id="payback-output">—</span></p>
      </div>
    </section>
  </div>
</main>
<div data-include="footer"></div>
<script src="/js/layout.js" defer></script>
<script src="/js/calc.js" defer></script>
</body>
</html>
