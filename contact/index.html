<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Контакты АгроКонтур: получить расчёт и план внедрения систем точного земледелия.">

  <link rel="stylesheet" href="/css/main.css">

<body data-page="contact">
<div data-include="header"></div>
<main>
  <div class="container">
    <section class="hero story">
      <h1>Обсудим проект внедрения под ваши поля и парк техники</h1>
      <p class="lead">В первой встрече фиксируем исходные данные, определяем точки потерь и готовим дорожную карту с экономической моделью.</p>
    </section>

    <section class="story card-grid">
      <article class="card"><h2>Телефон</h2><p><a href="tel:+78005553535">8 (800) 555-35-35</a></p></article>
      <article class="card"><h2>E-mail</h2><p><a href="mailto:info@agrocontur.ru">info@agrocontur.ru</a></p></article>
      <article class="card"><h2>Офис</h2><p>Воронеж, ул. Технологическая, 14</p></article>
    </section>

    <section class="story card">
      <h2>Запрос на расчёт</h2>
      <form class="form">
        <label>Ваше имя<input type="text" placeholder="Иван Петров"></label>
        <label>Компания<input type="text" placeholder="ООО «АгроЮг»"></label>
        <label>Площадь хозяйства, га<input type="number" placeholder="6200"></label>
        <label>Комментарий<textarea rows="4" placeholder="Какие задачи хотите решить в первую очередь"></textarea></label>
        <button type="button">Отправить запрос</button>
      </form>
    </section>
  </div>
</main>
<div data-include="footer"></div>
<script src="/js/layout.js" defer></script>

</html>
